---
# Monitoring for the nginx web servers, built around the four golden signals:
#   Latency    - how long requests take        (nginxlog-exporter: request time histogram)
#   Traffic    - how many requests per second  (nginxlog-exporter + nginx stub_status)
#   Errors     - how many requests fail (5xx)  (nginxlog-exporter: status codes)
#   Saturation - how "full" the server is      (node-exporter: CPU, memory, disk)
#
# Run after nginx.yml:  ansible-playbook monitoring.yml   (or: make monitoring)

- name: Prepare all hosts and install node-exporter
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

    - name: Wait for cloud-init to finish (apt lock)
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      failed_when: cloud_init.rc not in [0, 2]

    - name: Gather facts
      ansible.builtin.setup:

  tasks:
    # cloud-init grows the root partition only at first boot. If disk_size is
    # raised later in OpenTofu, grow the partition and filesystem here.
    # (Our template puts the root disk on scsi0 = /dev/sda, root = partition 1.)
    - name: Grow the root partition if the disk was enlarged
      ansible.builtin.command: growpart /dev/sda 1
      register: growpart
      changed_when: growpart.rc == 0
      failed_when: growpart.rc not in [0, 1]  # rc 1 = NOCHANGE, already full size

    - name: Grow the root filesystem
      ansible.builtin.command: resize2fs /dev/sda1
      when: growpart is changed

    - name: Install node-exporter (CPU, memory, disk, network metrics on :9100)
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure node-exporter is running
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true

- name: Export nginx metrics on the web servers
  hosts: web
  become: true

  vars:
    nginxlog_exporter_version: "1.11.0"
    nginxlog_exporter_deb: "prometheus-nginxlog-exporter_{{ nginxlog_exporter_version }}_linux_amd64.deb"
    nginxlog_exporter_url: "https://github.com/martin-helmich/prometheus-nginxlog-exporter/releases/download/v{{ nginxlog_exporter_version }}"

  tasks:
    - name: Add a timed access log and a local stub_status endpoint to nginx
      ansible.builtin.copy:
        src: files/nginx-monitoring.conf
        dest: /etc/nginx/conf.d/monitoring.conf
        mode: "0644"
      notify: Reload nginx

    - name: Install nginx-exporter (connections and requests from stub_status, :9113)
      ansible.builtin.apt:
        name: prometheus-nginx-exporter
        state: present

    - name: Point nginx-exporter at the local stub_status endpoint
      ansible.builtin.copy:
        dest: /etc/default/prometheus-nginx-exporter
        content: |
          # Managed by Ansible (monitoring.yml)
          ARGS="--nginx.scrape-uri=http://127.0.0.1:8080/stub_status"
        mode: "0644"
      notify: Restart nginx-exporter

    - name: Look up the nginxlog-exporter checksum
      ansible.builtin.set_fact:
        nginxlog_exporter_sha256: >-
          {{ lookup('ansible.builtin.url', nginxlog_exporter_url ~ '/checksums.txt', wantlist=True)
             | select('search', nginxlog_exporter_deb) | first | split | first }}

    - name: Download nginxlog-exporter (latency + status codes from the access log)
      ansible.builtin.get_url:
        url: "{{ nginxlog_exporter_url }}/{{ nginxlog_exporter_deb }}"
        dest: "/tmp/{{ nginxlog_exporter_deb }}"
        checksum: "sha256:{{ nginxlog_exporter_sha256 }}"
        mode: "0644"

    - name: Install nginxlog-exporter
      ansible.builtin.apt:
        deb: "/tmp/{{ nginxlog_exporter_deb }}"

    - name: Configure nginxlog-exporter (:4040)
      ansible.builtin.copy:
        src: files/nginxlog-exporter.yml
        dest: /etc/prometheus-nginxlog-exporter.yml
        mode: "0644"
      notify: Restart nginxlog-exporter

    # The packaged unit reads a sample .hcl config and drops all capabilities,
    # so it can't read nginx logs (www-data:adm, mode 640). Run it as an
    # unprivileged user in the "adm" group (the log-reader group) with our config.
    - name: Create the nginxlog-exporter systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/prometheus-nginxlog-exporter.service.d
        state: directory
        mode: "0755"

    - name: Run nginxlog-exporter with our config as a log reader
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus-nginxlog-exporter.service.d/override.conf
        content: |
          # Managed by Ansible (monitoring.yml)
          [Service]
          ExecStart=
          ExecStart=/usr/sbin/prometheus-nginxlog-exporter -config-file /etc/prometheus-nginxlog-exporter.yml
          DynamicUser=yes
          SupplementaryGroups=adm
        mode: "0644"
      notify: Restart nginxlog-exporter

    - name: Ensure the exporters are running
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - prometheus-nginx-exporter
        - prometheus-nginxlog-exporter

  handlers:
    - name: Check nginx config
      ansible.builtin.command: nginx -t
      changed_when: false
      listen: Reload nginx

    - name: Reload nginx service
      ansible.builtin.service:
        name: nginx
        state: reloaded
      listen: Reload nginx

    - name: Restart nginx-exporter
      ansible.builtin.service:
        name: prometheus-nginx-exporter
        state: restarted

    - name: Restart nginxlog-exporter
      ansible.builtin.systemd_service:
        name: prometheus-nginxlog-exporter
        state: restarted
        daemon_reload: true

- name: Install Prometheus and Grafana on the monitoring server
  hosts: monitoring
  become: true

  vars:
    prometheus_retention: 7d
    # Random password, created on your machine the first time and kept in .secrets/ (gitignored)
    grafana_admin_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/../.secrets/grafana-admin-password', chars=['ascii_letters', 'digits'], length=20) }}"

  tasks:
    # ---------- Prometheus ----------
    - name: Install Prometheus
      ansible.builtin.apt:
        name: prometheus
        state: present
        install_recommends: false  # skip extra collectors and docs (small disk)

    - name: Keep metrics for {{ prometheus_retention }} only (small disk)
      ansible.builtin.copy:
        dest: /etc/default/prometheus
        content: |
          # Managed by Ansible (monitoring.yml)
          ARGS="--storage.tsdb.retention.time={{ prometheus_retention }}"
        mode: "0644"
      notify: Restart Prometheus

    - name: Create the rules directory
      ansible.builtin.file:
        path: /etc/prometheus/rules
        state: directory
        mode: "0755"

    - name: Deploy golden-signal recording and alerting rules
      ansible.builtin.copy:
        src: files/prometheus/golden-signals.rules.yml
        dest: /etc/prometheus/rules/golden-signals.rules.yml
        mode: "0644"
        validate: promtool check rules %s
      notify: Reload Prometheus

    - name: Deploy prometheus.yml (scrape targets come from the inventory)
      ansible.builtin.template:
        src: templates/prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
        mode: "0644"
        validate: promtool check config %s
      notify: Reload Prometheus

    - name: Ensure Prometheus is running
      ansible.builtin.service:
        name: prometheus
        state: started
        enabled: true

    # ---------- Grafana ----------
    - name: Add the Grafana apt key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: "0644"

    - name: Add the Grafana apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
        filename: grafana
        state: present

    - name: Install Grafana
      ansible.builtin.apt:
        name: grafana
        state: present

    - name: Create the Grafana systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/grafana-server.service.d
        state: directory
        mode: "0755"

    - name: Configure Grafana (anonymous read-only access, home dashboard)
      ansible.builtin.copy:
        dest: /etc/systemd/system/grafana-server.service.d/override.conf
        content: |
          # Managed by Ansible (monitoring.yml)
          [Service]
          Environment=GF_AUTH_ANONYMOUS_ENABLED=true
          Environment=GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
          Environment=GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/golden-signals.json
          Environment=GF_ANALYTICS_REPORTING_ENABLED=false
          Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
        mode: "0644"
      notify: Restart Grafana

    - name: Provision the Prometheus data source
      ansible.builtin.copy:
        src: files/grafana/datasource.yml
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        mode: "0644"
      notify: Restart Grafana

    - name: Provision the dashboard folder
      ansible.builtin.copy:
        src: files/grafana/dashboards.yml
        dest: /etc/grafana/provisioning/dashboards/demo.yml
        mode: "0644"
      notify: Restart Grafana

    - name: Create the dashboards directory
      ansible.builtin.file:
        path: /var/lib/grafana/dashboards
        state: directory
        owner: grafana
        group: grafana
        mode: "0755"

    - name: Deploy the golden-signals dashboard
      ansible.builtin.copy:
        src: files/grafana/golden-signals.json
        dest: /var/lib/grafana/dashboards/golden-signals.json
        owner: grafana
        group: grafana
        mode: "0644"

    - name: Ensure Grafana is running
      ansible.builtin.systemd_service:
        name: grafana-server
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for Grafana to answer
      ansible.builtin.uri:
        url: http://localhost:3000/api/health
      register: grafana_health
      until: grafana_health.status == 200
      retries: 30
      delay: 2

    - name: Free disk space by removing downloaded .deb files
      ansible.builtin.apt:
        clean: true
      changed_when: false  # apt clean always reports "changed"; it's only housekeeping

    - name: Set the Grafana admin password
      ansible.builtin.command:
        argv: [grafana, cli, --homepath, /usr/share/grafana, admin, reset-admin-password, "{{ grafana_admin_password }}"]
      changed_when: false
      no_log: true

  handlers:
    - name: Restart Prometheus
      ansible.builtin.service:
        name: prometheus
        state: restarted

    - name: Reload Prometheus
      ansible.builtin.service:
        name: prometheus
        state: reloaded

    - name: Restart Grafana
      ansible.builtin.systemd_service:
        name: grafana-server
        state: restarted
        daemon_reload: true

- name: Check that Prometheus scrapes every target
  hosts: monitoring
  gather_facts: false

  tasks:
    - name: Wait until all scrape targets are up
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9090/api/v1/targets?state=active"
        return_content: true
      register: targets
      delegate_to: localhost
      until: >-
        targets.json.data.activeTargets | length > 0 and
        targets.json.data.activeTargets | rejectattr('health', 'equalto', 'up') | list | length == 0
      retries: 15
      delay: 4

    - name: Show where to look
      ansible.builtin.debug:
        msg:
          - "Grafana:    http://{{ ansible_host }}:3000/  (anonymous viewer; admin password in .secrets/grafana-admin-password)"
          - "Prometheus: http://{{ ansible_host }}:9090/  (Status -> Targets, Alerts)"
          - "Targets up: {{ targets.json.data.activeTargets | map(attribute='labels.job') | list }}"
