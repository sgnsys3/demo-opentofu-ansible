# Managed by Ansible (monitoring.yml)

# Same as the default "combined" format plus $request_time (seconds, ms resolution).
# prometheus-nginxlog-exporter reads this file to measure latency and status codes.
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 '$request_time';
access_log /var/log/nginx/access_timed.log timed;

# stub_status for prometheus-nginx-exporter: only reachable from the server itself.
server {
    listen 127.0.0.1:8080;
    access_log off;

    location = /stub_status {
        stub_status;
    }
}
